<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow - Habit Tracking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-slate-100 min-h-screen flex flex-col font-sans antialiased">
    <!-- Header -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="text-emerald-500 w-6 h-6"></i> HabitFlow
                </h1>
                <p class="text-xs text-slate-400">Build better daily routines</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-sm font-medium flex items-center gap-1 transition shadow-lg shadow-emerald-900/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Habit
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow pb-24">
        <!-- Stats Summary Card -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-dark-card border border-dark-border rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-1">
                    <span class="text-xs font-medium uppercase tracking-wider">Completed Today</span>
                    <i data-lucide="award" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div class="text-2xl font-bold text-white" id="today-completed-count">0/0</div>
            </div>
            <div class="bg-dark-card border border-dark-border rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-1">
                    <span class="text-xs font-medium uppercase tracking-wider">Active Streak</span>
                    <i data-lucide="flame" class="w-4 h-4 text-orange-400"></i>
                </div>
                <div class="text-2xl font-bold text-white" id="max-streak-count">0 days</div>
            </div>
        </div>

        <!-- Date Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400" id="current-date-label">Today</h2>
            <span class="text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full font-medium" id="streak-label">Keep it up!</span>
        </div>

        <!-- Habits List -->
        <div id="habits-container" class="space-y-3">
            <!-- Dynamically populated habits -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-500">
                <i data-lucide="list-todo" class="w-8 h-8"></i>
            </div>
            <h3 class="text-white font-medium mb-1">No habits tracked yet</h3>
            <p class="text-slate-400 text-sm mb-4">Add your first daily habit to start building your streak.</p>
            <button onclick="openAddModal()" class="text-emerald-400 font-medium text-sm hover:underline">Add a Habit Now</button>
        </div>
    </main>

    <!-- Add Habit Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white">Create New Habit</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="habit-form" onsubmit="handleHabitSubmit(event)">
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Habit Name</label>
                    <input type="text" id="habit-name-input" required placeholder="e.g., Morning Meditation, Read 20 pages" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Category</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setCategory('Fitness')" class="cat-btn py-2.5 px-3 rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-400 text-xs font-medium transition" data-cat="Fitness">Fitness</button>
                        <button type="button" onclick="setCategory('Mind')" class="cat-btn py-2.5 px-3 rounded-xl border border-dark-border bg-dark-bg text-slate-400 text-xs font-medium transition" data-cat="Mind">Mind</button>
                        <button type="button" onclick="setCategory('Health')" class="cat-btn py-2.5 px-3 rounded-xl border border-dark-border bg-dark-bg text-slate-400 text-xs font-medium transition" data-cat="Health">Health</button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-900/20 text-sm">Save Habit</button>
            </form>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        let habits = JSON.parse(localStorage.getItem('habitflow_habits')) || [
            { id: '1', name: 'Morning Walk 30m', category: 'Fitness', history: {}, streak: 0 },
            { id: '2', name: 'Read 15 Pages', category: 'Mind', history: {}, streak: 0 }
        ];
        let selectedCategory = 'Fitness';

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function saveHabits() {
            localStorage.setItem('habitflow_habits', JSON.stringify(habits));
            render();
        }

        function render() {
            const container = document.getElementById('habits-container');
            const emptyState = document.getElementById('empty-state');
            const todayKey = getTodayKey();
            
            // Format today date label
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('current-date-label').innerText = new Date().toLocaleDateString('en-US', options);

            if (habits.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.getElementById('today-completed-count').innerText = `0/0`;
                document.getElementById('max-streak-count').innerText = `0 days`;
                return;
            }

            emptyState.classList.add('hidden');
            let completedTodayCount = 0;
            let maxStreak = 0;

            container.innerHTML = habits.map(habit => {
                const isCompleted = habit.history[todayKey] || false;
                if (isCompleted) completedTodayCount++;
                if (habit.streak > maxStreak) maxStreak = habit.streak;

                return `
                    <div class="bg-dark-card border border-dark-border rounded-2xl p-4 flex items-center justify-between shadow-sm transition hover:border-slate-600">
                        <div class="flex items-center gap-3">
                            <button onclick="toggleHabit('${habit.id}')" class="w-7 h-7 rounded-lg border ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600 bg-dark-bg text-transparent'} flex items-center justify-center transition shadow-sm">
                                <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
                            </button>
                            <div>
                                <h4 class="text-sm font-semibold text-white ${isCompleted ? 'line-through text-slate-500' : ''}">${habit.name}</h4>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-[10px] text-slate-400 bg-dark-bg px-2 py-0.5 rounded-md border border-dark-border">${habit.category}</span>
                                    <span class="text-[10px] text-orange-400 flex items-center gap-0.5"><i data-lucide="flame" class="w-3 h-3"></i> ${habit.streak} streak</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteHabit('${habit.id}')" class="text-slate-500 hover:text-red-400 p-2 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('today-completed-count').innerText = `${completedTodayCount}/${habits.length}`;
            document.getElementById('max-streak-count').innerText = `${maxStreak} days`;
            lucide.createIcons();
        }

        function toggleHabit(id) {
            const todayKey = getTodayKey();
            habits = habits.map(h => {
                if (h.id === id) {
                    const currentStatus = h.history[todayKey] || false;
                    h.history[todayKey] = !currentStatus;
                    h.streak = h.history[todayKey] ? h.streak + 1 : Math.max(0, h.streak - 1);
                }
                return h;
            });
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('habit-name-input').focus();
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('habit-form').reset();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn py-2.5 px-3 rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-400 text-xs font-medium transition";
                } else {
                    btn.className = "cat-btn py-2.5 px-3 rounded-xl border border-dark-border bg-dark-bg text-slate-400 text-xs font-medium transition";
                }
            });
        }

        function handleHabitSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('habit-name-input').value.trim();
            if (!nameInput) return;

            const newHabit = {
                id: Date.now().toString(),
                name: nameInput,
                category: selectedCategory,
                history: {},
                streak: 0
            };

            habits.push(newHabit);
            closeAddModal();
            saveHabits();
        }

        render();
    </script>
</body>
</html>
